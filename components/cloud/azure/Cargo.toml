[package]
name = "azure"
version = "0.0.1"
edition = "2018"
publish = false

[dependencies]
async-trait = "0.1"
azure_core = { version = "0.18", default-features = false, features = ["enable_reqwest", "hmac_openssl"] }
azure_identity = "0.18"
azure_storage = { version = "0.18", default-features = false, features = ["enable_reqwest", "hmac_openssl"] }
azure_storage_blobs = { version = "0.18", default-features = false, features = ["enable_reqwest", "hmac_openssl"] }
base64 = "0.13"
bytes = "1.0"
chrono = "0.4"
cloud = { workspace = true }
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["io"] }
kvproto = { workspace = true }
oauth2 = { version = "4.4", default-features = false }
slog = { version = "2.3", features = ["max_level_trace", "release_max_level_debug"] }
slog-global = { version = "0.1", git = "https://github.com/breeswish/slog-global.git", rev = "d592f88e4dbba5eb439998463054f1a44fbf17b9" }
tikv_util = { workspace = true }
tokio = { version = "1.5", features = ["time"] }
url = "2.0"
