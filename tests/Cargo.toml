[package]
name = "tests"
version = "0.0.1"
edition = "2018"
publish = false

[[test]]
name = "failpoints"
path = "failpoints/mod.rs"
required-features = ["failpoints", "testexport"]

[[test]]
name = "integrations"
path = "integrations/mod.rs"
required-features = ["testexport"]

[[test]]
name = "cloud_engine"
path = "cloud_engine/mod.rs"
required-features = ["testexport"]

[[test]]
name = "random"
path = "random/mod.rs"
required-features = ["testexport", "failpoints"]

[[test]]
name = "cloud_engine_failpoints"
path = "cloud_engine_failpoints/mod.rs"
required-features = ["failpoints", "testexport"]

[[test]]
name = "rfstore"
path = "rfstore/mod.rs"
required-features = ["testexport"]

[[bench]]
name = "raftstore"
harness = false
path = "benches/raftstore/mod.rs"

[[bench]]
name = "coprocessor_executors"
harness = false
path = "benches/coprocessor_executors/mod.rs"

[[bench]]
name = "hierarchy"
harness = false
path = "benches/hierarchy/mod.rs"

[[bench]]
name = "misc"
path = "benches/misc/mod.rs"
test = true

[[bench]]
name = "deadlock_detector"
harness = false
path = "benches/deadlock_detector/mod.rs"

[[bench]]
name = "storage_class"
harness = false
path = "cloud_engine_benches/storage_class/mod.rs"

[features]
default = ["failpoints", "testexport", "cloud-aws", "cloud-gcp", "cloud-azure"]
failpoints = [
    "fail/failpoints",
    "tikv/failpoints",
    "pd_client/failpoints",
    "tikv_util/failpoints",
    "native_br/failpoints",
    "rfengine/failpoints",
]
cloud-aws = ["external_storage_export/cloud-aws"]
cloud-gcp = ["external_storage_export/cloud-gcp"]
cloud-azure = ["external_storage_export/cloud-azure"]
testexport = [
    "raftstore/testexport",
    "tikv/testexport",
    "pd_client/testexport",
    "kvengine/testexport",
    "schema/testexport",
    "rfstore/testexport",
    "rfengine/testexport",
    "native_br/testexport",
    "cloud_worker/testexport",
    "test_cloud_server/testexport",
    "tikv_util/testexport",
    "replication_worker/testexport",
]
profiling = ["profiler/profiling"]

# Usage: set environment variable RUST_LOG (e.g, export RUST_LOG="info,raft=debug")
# Ref: https://docs.rs/env_logger/latest/env_logger/#enabling-logging
env-logger = ["tikv_util/env-logger", "slog-envlogger"]
jemalloc = ["tikv/jemalloc"]
mimalloc = ["tikv/mimalloc"]
snmalloc = ["tikv/snmalloc"]
mem-profiling = ["tikv/mem-profiling"]
sse = ["tikv/sse"]
portable = ["tikv/portable"]

debug-trace-ia-segments = ["kvengine/debug-trace-ia-segments"]
debug-trace-mem-table = ["kvengine/debug-trace-mem-table"]
debug-trace-txn-tasks = [
    "tikv/debug-trace-txn-tasks",
    "test_cloud_server/debug-trace-txn-tasks",
]

[dependencies]
api_version = { workspace = true }
async-trait = "0.1"
bincode = "1.3"
bytes = "1.1"
cdc = { workspace = true }
chrono = "0.4"
clara_fts = { path = "../components/clara_fts" }
cloud_encryption = { workspace = true }
cloud_server = { workspace = true }
cloud_worker = { workspace = true }
collections = { workspace = true }
crc64fast = "0.1"
crossbeam = "0.8"
dashmap = "4.0"
encryption = { workspace = true }
error_code = { workspace = true }
fail = "0.5"
file_system = { workspace = true }
futures = "0.3"
grpcio = { workspace = true }
grpcio-health = { version = "0.10", default-features = false }
hex = "0.4"
http = "0.2.8"
kvengine = { workspace = true, features = ["testexport"] }
kvenginepb = { workspace = true }
kvproto = { workspace = true }
libc = "0.2"
load_data = { path = "../components/load_data" }
log = "0.4"
log_wrappers = { workspace = true }
merged_engine = { workspace = true }
more-asserts = "0.2"
native_br = { workspace = true }
online_config = { workspace = true }
paste = "1.0"
pd_client = { workspace = true }
protobuf = { version = "2.8", features = ["bytes"] }
raft = { version = "0.7.0", default-features = false, features = ["protobuf-codec"] }
raft-proto = { version = "0.7.0", default-features = false }
raftstore = { workspace = true }
rand = "0.8.3"
replication_worker = { workspace = true }
rfengine = { workspace = true }
rfenginepb = { workspace = true }
rfstore = { workspace = true }
schema = { workspace = true }
serde_json = "1.0"
slog = { version = "2.3", features = ["max_level_trace", "release_max_level_debug"] }
slog-envlogger = { version = "2.2.0", optional = true }
slog-global = { version = "0.1", git = "https://github.com/breeswish/slog-global.git", rev = "d592f88e4dbba5eb439998463054f1a44fbf17b9" }
sqlx = { version = "0.5", features = ["runtime-tokio-rustls", "mysql", "chrono", "bigdecimal"] }
tempfile = "3.0"
tidb_query_aggr = { workspace = true }
tidb_query_common = { workspace = true }
tidb_query_datatype = { workspace = true }
tidb_query_executors = { workspace = true }
tidb_query_expr = { workspace = true }
tikv = { workspace = true }
tikv-client = { workspace = true }
tikv_util = { workspace = true }
time = "0.1"
tipb = { workspace = true }
toml = "0.5"
txn_types = { workspace = true }
uuid = { version = "0.8.1", features = ["serde", "v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
procinfo = { git = "https://github.com/tikv/procinfo-rs", rev = "6599eb9dca74229b2c1fcc44118bef7eff127128" }

[dev-dependencies]
anyhow = "1.0"
arrow = "13.0"
byteorder = "1.2"
# See https://bheisler.github.io/criterion.rs/book/user_guide/known_limitations.html for the usage
# of `real_blackbox` feature.
codec = { workspace = true }
concurrency_manager = { workspace = true }
criterion = "0.3"
criterion-cpu-time = "0.1"
engine_rocks = { workspace = true }
engine_traits = { workspace = true }
external_storage_export = { workspace = true }
file_system = { workspace = true }
hyper = { version = "0.14", default-features = false, features = ["runtime"] }
keys = { workspace = true }
lazy_static = "1.3"
panic_hook = { workspace = true }
profiler = { workspace = true }
proptest = "1.4"
rand_xorshift = "0.3"
resource_metering = { workspace = true }
rstest = "0.18"
security = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
sst_importer = { workspace = true }
test_cloud_server = { workspace = true }
test_coprocessor = { workspace = true }
test_pd = { workspace = true }
test_pd_client = { workspace = true }
test_raftstore = { workspace = true }
test_sst_importer = { workspace = true }
test_storage = { workspace = true }
test_util = { workspace = true }
tidb_query_datatype = { workspace = true }
tikv-client = { workspace = true }
tikv_kv = { workspace = true }
tipb_helper = { workspace = true }
tokio = { version = "1.5", features = ["rt-multi-thread"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
criterion-perf-events = "0.1"
perfcnt = "0.7"
